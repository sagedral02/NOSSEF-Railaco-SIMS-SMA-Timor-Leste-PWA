          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicYearRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicYearRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
  /api/v1/academic-years/{id}/:
