      type: object
      properties:
        note:
          type: string
          default: ''
    NoticeRequest:
      type: object
      properties:
        notice:
          type: string
          minLength: 1
      required:
      - notice
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          maxLength: 80
        title:
          type: string
          maxLength: 200
        body:
          type: string
        target_url:
          type: string
          maxLength: 300
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - title
      - type
