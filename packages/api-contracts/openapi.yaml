openapi: 3.0.3
info:
  title: SIMS SMA Timor-Leste — NOSSEF API
  version: 1.0.0
  description: 'Canonical REST API (PRD §46–§48). Envelope: {data, meta} / {error}.'
paths:
  /api/v1/academic-years/:
    get:
      operationId: academic_years_list
      description: ModelViewSet with permission map, audit trail and dependency-safe
        delete.
      tags:
      - academics
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicYear'
          description: ''
    post:
