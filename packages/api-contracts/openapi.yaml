      type: object
      description: Runs Model.full_clean() (incl. CheckConstraint/UniqueConstraint
        validation) before saving.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 30
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/AcademicYearStatusEnum'
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
        trimesters:
          type: array
          items:
            $ref: '#/components/schemas/Trimester'
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - end_date
      - id
      - is_current
      - name
      - start_date
      - status
      - trimesters
      - updated_at
    AcademicYearRequest:
      type: object
      description: Runs Model.full_clean() (incl. CheckConstraint/UniqueConstraint
        validation) before saving.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - end_date
      - name
      - start_date
