      enum:
      - DRAFT
      - ACTIVE
      - CLOSED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `ACTIVE` - Active
        * `CLOSED` - Closed
    AccountStatusEnum:
      enum:
      - CREATED
      - INVITED
      - ACTIVE
      - SUSPENDED
      - DISABLED
      type: string
      description: |-
        * `CREATED` - Created
        * `INVITED` - Invited
        * `ACTIVE` - Active
        * `SUSPENDED` - Suspended
        * `DISABLED` - Disabled
    ActionTypeEnum:
      enum:
      - NONE
      - WARNING
      - COUNSELING_REFERRAL
      - PARENT_MEETING
      - OTHER
